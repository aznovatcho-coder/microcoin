<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متطلبات السحب - مواقع التعدين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .table-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 900px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: linear-gradient(90deg, #4361ee, #3a0ca3);
        }
        
        th {
            padding: 20px;
            font-size: 1.2rem;
            text-align: center;
            font-weight: 600;
        }
        
        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        td {
            padding: 25px;
            text-align: center;
            font-size: 1.1rem;
        }
        
        .site-name {
            font-weight: bold;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .bnb-icon {
            color: #f0b90b;
        }
        
        .doge-icon {
            color: #c2a633;
        }
        
        .withdrawal-info {
            font-size: 1.2rem;
            padding: 10px 20px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
            display: inline-block;
            margin: 5px 0;
        }
        
        .bnb-bg {
            background: rgba(240, 185, 11, 0.1);
            border-left: 4px solid #f0b90b;
        }
        
        .doge-bg {
            background: rgba(194, 166, 51, 0.1);
            border-left: 4px solid #c2a633;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            outline: none;
        }
        
        .earn-btn {
            background: linear-gradient(90deg, #4cc9f0, #4361ee);
            color: white;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.4);
        }
        
        .earn-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(67, 97, 238, 0.6);
        }
        
        .earn-btn:active {
            transform: translateY(1px);
        }
        
        @media (max-width: 768px) {
            th, td {
                padding: 15px 10px;
            }
            
            .site-name {
                font-size: 1.1rem;
            }
            
            .btn {
                padding: 12px 20px;
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            .table-container {
                border-radius: 10px;
            }
            
            table {
                display: block;
                overflow-x: auto;
            }
            
            th, td {
                padding: 12px 8px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>اسم الموقع</th>
                    <th>الحد الأدنى للسحب</th>
                    <th>الوصول إلى الموقع</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <div class="site-name">
                            <i class="fas fa-dog doge-icon"></i>
                            DogeKing.io
                        </div>
                    </td>
                    <td>
                        <div class="withdrawal-info doge-bg">
                            15 عملة BNB
                        </div>
                        <p style="margin-top: 8px; font-size: 0.9rem; color: #ccc;">للبدء في سحب أرباحك</p>
                    </td>
                    <td>
                        <a href="https://dogeking.io/?ref=Simonx11" target="_blank" class="btn earn-btn">
                            <i class="fas fa-gem"></i> Earn
                        </a>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="site-name">
                            <i class="fab fa-bnb bnb-icon"></i>
                            BNBKing.io
                        </div>
                    </td>
                    <td>
                        <div class="withdrawal-info bnb-bg">
                            0.0001 عملة BNB
                        </div>
                        <p style="margin-top: 8px; font-size: 0.9rem; color: #ccc;">للبدء في سحب أرباحك</p>
                    </td>
                    <td>
                        <a href="https://bnbking.io/?ref=mostafatoza" target="_blank" class="btn earn-btn">
                            <i class="fas fa-gem"></i> Earn
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <script>
        // إضافة تأثيرات تفاعلية للأزرار
        document.addEventListener('DOMContentLoaded', function() {
            const earnButtons = document.querySelectorAll('.earn-btn');
            
            earnButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    // تأثير النقر على الزر
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 200);
                });
            });
            
            // إضافة تأثير عند التمرير على الصفوف
            const tableRows = document.querySelectorAll('tbody tr');
            tableRows.forEach(row => {
                row.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-5px)';
                });
                
                row.addEventListener('mouseleave', function() {
                    this.style.transform = '';
                });
            });
        });
    </script>
</body>
</html>
