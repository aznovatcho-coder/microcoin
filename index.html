<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متطلبات السحب - مواقع التعدين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .table-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 95%;
            max-width: 1200px;
            padding: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: linear-gradient(90deg, #4361ee, #3a0ca3);
        }
        
        th {
            padding: 25px 15px;
            font-size: 1.4rem;
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        
        tbody tr:hover {
            background: rgba(255, 255, 255, 0.07);
        }
        
        td {
            padding: 30px 20px;
            text-align: center;
            font-size: 1.3rem;
        }
        
        .site-name {
            font-weight: bold;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .bnb-icon {
            color: #f0b90b;
            font-size: 1.8rem;
        }
        
        .doge-icon {
            color: #c2a633;
            font-size: 1.8rem;
        }
        
        .withdrawal-info {
            font-size: 1.5rem;
            padding: 15px 25px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.25);
            display: inline-block;
            margin: 8px 0;
            font-weight: 600;
        }
        
        .bnb-bg {
            background: rgba(240, 185, 11, 0.15);
            border-left: 5px solid #f0b90b;
        }
        
        .doge-bg {
            background: rgba(194, 166, 51, 0.15);
            border-left: 5px solid #c2a633;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 60px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            outline: none;
            min-width: 180px;
        }
        
        .earn-btn {
            background: linear-gradient(90deg, #4cc9f0, #4361ee);
            color: white;
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.5);
        }
        
        .earn-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(67, 97, 238, 0.7);
        }
        
        .earn-btn:active {
            transform: translateY(1px);
        }
        
        .note {
            margin-top: 10px;
            font-size: 1rem;
            color: #aaa;
        }
        
        /* توسيع الأعمدة */
        th:nth-child(1), td:nth-child(1) {
            width: 30%;
        }
        
        th:nth-child(2), td:nth-child(2) {
            width: 40%;
        }
        
        th:nth-child(3), td:nth-child(3) {
            width: 30%;
        }
        
        @media (max-width: 992px) {
            .table-container {
                width: 98%;
                padding: 5px;
            }
            
            th {
                padding: 20px 10px;
                font-size: 1.2rem;
            }
            
            td {
                padding: 25px 15px;
                font-size: 1.1rem;
            }
            
            .site-name {
                font-size: 1.3rem;
            }
            
            .withdrawal-info {
                font-size: 1.3rem;
                padding: 12px 20px;
            }
            
            .btn {
                padding: 16px 30px;
                font-size: 1.2rem;
                min-width: 150px;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }
            
            .table-container {
                border-radius: 15px;
            }
            
            th {
                padding: 18px 8px;
                font-size: 1.1rem;
            }
            
            td {
                padding: 20px 10px;
                font-size: 1rem;
            }
            
            .site-name {
                font-size: 1.1rem;
                flex-direction: column;
                gap: 8px;
            }
            
            .withdrawal-info {
                font-size: 1.1rem;
                padding: 10px 15px;
            }
            
            .btn {
                padding: 14px 20px;
                font-size: 1.1rem;
                min-width: 120px;
            }
            
            .bnb-icon, .doge-icon {
                font-size: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .table-container {
                overflow-x: auto;
                border-radius: 10px;
            }
            
            table {
                min-width: 600px;
            }
            
            th, td {
                padding: 15px 8px;
            }
            
            .btn {
                padding: 12px 15px;
                font-size: 1rem;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>اسم الموقع</th>
                    <th>الحد الأدنى للسحب</th>
                    <th>الوصول إلى الموقع</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <div class="site-name">
                            <i class="fas fa-dog doge-icon"></i>
                            DogeKing.io
                        </div>
                    </td>
                    <td>
                        <div class="withdrawal-info doge-bg">
                            15 عملة BNB
                        </div>
                        <div class="note">للبدء في سحب أرباحك</div>
                    </td>
                    <td>
                        <a href="https://dogeking.io/?ref=Simonx11" target="_blank" class="btn earn-btn">
                            <i class="fas fa-gem"></i> Earn
                        </a>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="site-name">
                            <i class="fab fa-bnb bnb-icon"></i>
                            BNBKing.io
                        </div>
                    </td>
                    <td>
                        <div class="withdrawal-info bnb-bg">
                            0.0001 عملة BNB
                        </div>
                        <div class="note">للبدء في سحب أرباحك</div>
                    </td>
                    <td>
                        <a href="https://bnbking.io/?ref=mostafatoza" target="_blank" class="btn earn-btn">
                            <i class="fas fa-gem"></i> Earn
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <script>
        // إضافة تأثيرات تفاعلية للأزرار
        document.addEventListener('DOMContentLoaded', function() {
            const earnButtons = document.querySelectorAll('.earn-btn');
            
            earnButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    // تأثير النقر على الزر
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 200);
                });
            });
            
            // إضافة تأثير عند التمرير على الصفوف
            const tableRows = document.querySelectorAll('tbody tr');
            tableRows.forEach(row => {
                row.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-8px)';
                    this.style.boxShadow = '0 10px 25px rgba(0, 0, 0, 0.2)';
                });
                
                row.addEventListener('mouseleave', function() {
                    this.style.transform = '';
                    this.style.boxShadow = 'none';
                });
            });
        });
    </script>
</body>
</html>
