<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متطلبات السحب - مواقع التعدين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }
        
        .desktop-layout {
            width: 100%;
            min-width: 1000px;
            padding: 20px;
            margin: 0 auto;
        }
        
        .table-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        
        thead {
            background: linear-gradient(90deg, #4361ee, #3a0ca3);
        }
        
        th {
            padding: 18px 10px;
            font-size: 1.2rem;
            text-align: center;
            font-weight: 700;
            white-space: nowrap;
        }
        
        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.3s ease;
        }
        
        tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }
        
        tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        
        td {
            padding: 25px 15px;
            text-align: center;
            vertical-align: middle;
        }
        
        .site-name {
            font-weight: bold;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .bnb-icon {
            color: #f0b90b;
            font-size: 1.5rem;
        }
        
        .doge-icon {
            color: #c2a633;
            font-size: 1.5rem;
        }
        
        .withdrawal-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .withdrawal-info {
            font-size: 1.4rem;
            padding: 12px 20px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            font-weight: 600;
            display: inline-block;
            min-width: 250px;
        }
        
        .bnb-bg {
            background: linear-gradient(135deg, rgba(240, 185, 11, 0.2), rgba(240, 185, 11, 0.1));
            border-left: 4px solid #f0b90b;
        }
        
        .doge-bg {
            background: linear-gradient(135deg, rgba(194, 166, 51, 0.2), rgba(194, 166, 51, 0.1));
            border-left: 4px solid #c2a633;
        }
        
        .note {
            font-size: 0.9rem;
            color: #aaa;
            font-style: italic;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            min-width: 180px;
        }
        
        .earn-btn {
            background: linear-gradient(90deg, #4cc9f0, #4361ee);
            color: white;
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
        }
        
        .earn-btn:hover, .earn-btn:active {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.6);
        }
        
        /* تحديد عرض الأعمدة */
        th:nth-child(1), td:nth-child(1) {
            width: 25%;
            min-width: 200px;
        }
        
        th:nth-child(2), td:nth-child(2) {
            width: 45%;
            min-width: 300px;
        }
        
        th:nth-child(3), td:nth-child(3) {
            width: 30%;
            min-width: 180px;
        }
        
        /* شريط التمرير الأفقي */
        .table-container::-webkit-scrollbar {
            height: 8px;
        }
        
        .table-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        
        .table-container::-webkit-scrollbar-thumb {
            background: #4361ee;
            border-radius: 4px;
        }
        
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #3a0ca3;
        }
        
        /* تصميم متجاوب للجوال */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .desktop-layout {
                min-width: unset;
                padding: 10px;
            }
            
            .table-container {
                border-radius: 10px;
            }
            
            th {
                padding: 15px 8px;
                font-size: 1.1rem;
            }
            
            td {
                padding: 20px 10px;
            }
            
            .site-name {
                font-size: 1.2rem;
                flex-direction: column;
                gap: 5px;
            }
            
            .withdrawal-info {
                font-size: 1.2rem;
                padding: 10px 15px;
                min-width: 200px;
            }
            
            .btn {
                padding: 12px 20px;
                font-size: 1.1rem;
                min-width: 140px;
            }
        }
        
        @media (max-width: 480px) {
            th {
                font-size: 1rem;
                padding: 12px 5px;
            }
            
            td {
                padding: 15px 8px;
            }
            
            .withdrawal-info {
                font-size: 1.1rem;
                padding: 8px 12px;
                min-width: 180px;
            }
            
            .btn {
                padding: 10px 15px;
                font-size: 1rem;
                min-width: 120px;
            }
            
            .site-name {
                font-size: 1.1rem;
            }
        }
        
        /* تلميح للمستخدم للتمرير */
        .scroll-hint {
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: fadeInOut 2s infinite;
        }
        
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="desktop-layout">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>اسم الموقع</th>
                        <th>الحد الأدنى للسحب</th>
                        <th>الوصول إلى الموقع</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <div class="site-name">
                                <i class="fas fa-dog doge-icon"></i>
                                DogeKing.io 🔥
                            </div>
                        </td>
                        <td>
                            <div class="withdrawal-container">
                                <div class="withdrawal-info doge-bg">
                                    15 عملة BNB
                                </div>
                                <div class="note">للمدة في نصب أرباحك</div>
                            </div>
                        </td>
                        <td>
                            <a href="https://dogeking.io/?ref=Simonx11" target="_blank" class="btn earn-btn">
                                <i class="fas fa-gem"></i> Earn 🤑
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="site-name">
                                <i class="fab fa-bnb bnb-icon"></i>
                                BNBKing.io
                            </div>
                        </td>
                        <td>
                            <div class="withdrawal-container">
                                <div class="withdrawal-info bnb-bg">
                                    0.0001 عملة BNB
                                </div>
                                <div class="note">للمدة في نصب أرباحك</div>
                            </div>
                        </td>
                        <td>
                            <a href="https://bnbking.io/?ref=mostafatoza" target="_blank" class="btn earn-btn">
                                <i class="fas fa-gem"></i> Earn 🤑
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="scroll-hint">
            <i class="fas fa-arrows-left-right"></i>
            اسحب لليمين لرؤية كامل الجدول
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // إضافة تأثيرات تفاعلية للأزرار
            const earnButtons = document.querySelectorAll('.earn-btn');
            
            earnButtons.forEach(button => {
                // تأثير عند اللمس على الهاتف
                button.addEventListener('touchstart', function() {
                    this.style.transform = 'scale(0.95)';
                });
                
                button.addEventListener('touchend', function() {
                    this.style.transform = '';
                });
                
                // تأثير عند النقر بالماوس
                button.addEventListener('click', function(e) {
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 200);
                    
                    // فتح الرابط في نافذة جديدة
                    e.preventDefault();
                    const url = this.getAttribute('href');
                    window.open(url, '_blank', 'noopener,noreferrer');
                });
            });
            
            // إضافة تأثير عند التمرير على الصفوف
            const tableRows = document.querySelectorAll('tbody tr');
            tableRows.forEach(row => {
                row.addEventListener('touchstart', function() {
                    this.style.backgroundColor = 'rgba(255, 255, 255, 0.08)';
                });
                
                row.addEventListener('touchend', function() {
                    setTimeout(() => {
                        this.style.backgroundColor = '';
                    }, 300);
                });
            });
            
            // إخفاء تلميح التمرير بعد 5 ثواني
            setTimeout(() => {
                const hint = document.querySelector('.scroll-hint');
                if (hint) {
                    hint.style.opacity = '0';
                    setTimeout(() => {
                        hint.style.display = 'none';
                    }, 500);
                }
            }, 5000);
        });
    </script>
</body>
</html>
